<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Quiz Teknologi & AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #2563eb);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .center {
      text-align: center;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      color: #312e81;
    }

    h2 {
      color: #312e81;
    }

    p {
      line-height: 1.6;
      color: #4b5563;
    }

    .info {
      background: #eef2ff;
      padding: 15px;
      border-radius: 14px;
      margin: 20px 0;
      line-height: 1.7;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      padding: 13px 22px;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .primary {
      background: #4f46e5;
      color: white;
      width: 100%;
    }

    .primary:hover {
      background: #4338ca;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      color: #4b5563;
      font-weight: bold;
    }

    .progress-bg {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #4f46e5;
      transition: width 0.3s;
    }

    .question {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      text-align: left;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      color: #1f2937;
    }

    .option:hover:not(:disabled) {
      border-color: #6366f1;
      background: #eef2ff;
    }

    .option.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    .option.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .option:disabled {
      cursor: default;
    }

    .next-area {
      margin-top: 20px;
    }

    .score {
      font-size: 54px;
      font-weight: bold;
      color: #4f46e5;
      margin: 15px 0;
    }

    .message {
      font-size: 20px;
      font-weight: bold;
    }

    .review {
      text-align: left;
      margin-top: 25px;
      max-height: 300px;
      overflow-y: auto;
    }

    .review-item {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #f3f4f6;
      font-size: 14px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 22px;
        border-radius: 18px;
      }

      h1 {
        font-size: 27px;
      }

      .question {
        font-size: 19px;
      }

      .logo {
        font-size: 52px;
      }

      .topbar {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- =========================
         HALAMAN MULAI
    ========================== -->
    <section id="startScreen" class="card center">

      <div class="logo">🤖</div>

      <div class="badge">
        🎮 QUIZ GAME
      </div>

      <h1>Quiz Teknologi & AI</h1>

      <p>
        Uji pengetahuanmu tentang teknologi
        dan Artificial Intelligence!
      </p>

      <div class="info">
        <strong>📚 15 Soal</strong><br>
        Pilih jawaban A, B, C, atau D.<br>
        🔀 Pilihan jawaban akan diacak setiap quiz.
      </div>

      <button class="primary" onclick="startQuiz()">
        🚀 Mulai Quiz
      </button>

    </section>


    <!-- =========================
         HALAMAN QUIZ
    ========================== -->
    <section id="quizScreen" class="card hidden">

      <div class="topbar">

        <span id="questionNumber">
          Soal 1 dari 15
        </span>

        <span id="scoreText">
          Skor: 0
        </span>

      </div>

      <div class="progress-bg">
        <div id="progress" class="progress"></div>
      </div>

      <div id="question" class="question"></div>

      <div id="options" class="options"></div>

      <div class="next-area">

        <button
          id="nextButton"
          class="primary hidden"
          onclick="nextQuestion()">
          Soal Berikutnya ➜
        </button>

      </div>

    </section>


    <!-- =========================
         HALAMAN HASIL
    ========================== -->
    <section id="resultScreen" class="card center hidden">

      <div class="logo">🏆</div>

      <h1>Quiz Selesai!</h1>

      <p>Skor kamu:</p>

      <div id="finalScore" class="score">
        0/15
      </div>

      <p id="percentage"></p>

      <p id="resultMessage" class="message"></p>

      <div id="review" class="review"></div>

      <br>

      <button
        class="primary"
        onclick="restartQuiz()">
        🔄 Main Lagi
      </button>

    </section>

  </main>

    /* =====================================
       VARIABEL GAME
    ====================================== */

    let currentQuestion = 0;

    let score = 0;

    let userAnswers = [];

    // Ini akan menyimpan soal yang sudah diacak
    let quizQuestions = [];


    /* =====================================
       FUNGSI MENGACAK ARRAY
    ====================================== */

    function shuffle(array) {

      // Fisher-Yates Shuffle
      for (
        let i = array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [
          array[i],
          array[j]
        ] =
        [
          array[j],
          array[i]
        ];

      }

      return array;
    }


    /* =====================================
       MULAI QUIZ
    ====================================== */

      currentQuestion = 0;

      userAnswers = [];

        Membuat salinan soal.

      */

      quizQuestions =
        questions.map(function(q) {

          return {

            question: q.question,

            options:
              q.options.map(function(text, index) {

                return {

                  text: text,

                  // Menandai jawaban benar
                  correct:
                    index === q.answer

                };

              })

          };

        });


      /*
        MENGACAK PILIHAN A, B, C, D
        untuk setiap soal.
      */

      quizQuestions.forEach(function(q) {

        shuffle(q.options);

      });


      /*
        Tampilkan halaman quiz
      */

      document
        .getElementById("startScreen")
        .classList.add("hidden");

      document
        .getElementById("resultScreen")
        .classList.add("hidden");

      document
        .getElementById("quizScreen")
        .classList.remove("hidden");


      showQuestion();

    }

      const q =

      document

        .textContent =
        `Soal ${currentQuestion + 1} dari ${quizQuestions.length}`;


      document
        .getElementById("scoreText")
